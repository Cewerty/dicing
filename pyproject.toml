[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"



[project]
name = "dicing"
version = "0.4.0"
description = "Typed, extensible dice library for tabletop RPGs: dice pools, keep/drop, advantage and a dice notation parser (4d6kh3+2) with a CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cewerty" }]
keywords = ["dice", "dnd", "rpg", "ttrpg", "dice-notation", "dice-roller", "tabletop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Typing :: Typed",
]
dependencies = [
    "lark>=1.3.1",
    "typing_extensions>=4.4; python_version < '3.12'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17.0",
    "ruff>=0.12.5",
    "pytest>=7.0",
    "pre-commit>=4.3.0",
    "makefile>=1.1.0",
    "setuptools>=80.9.0",
    "uv>=0.8.14",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.100",
    # ty is pre-1.0: pin exactly, its rules change between releases
    "ty==0.0.106",
]
docs = [
    "sphinx>=8.1",
]

[project.urls]
Homepage = "https://github.com/Cewerty/dicing"
Repository = "https://github.com/Cewerty/dicing"
Issues = "https://github.com/Cewerty/dicing/issues"
Changelog = "https://github.com/Cewerty/dicing/blob/main/CHANGELOG.md"

[project.scripts]
dicing = "dicing.cli:main"

[tool.setuptools.package-data]
dicing = ["py.typed", "utils/parser/dice_grammar.lark"]

[[tool.mypy.overrides]]
module = "dicing.*"
follow_untyped_imports = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "hello.py",
    "docs"
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
preview = true
select = [
        # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    "C90",
    "PL",
    "RUF",
    "TRY",
    "ANN",
    "S",
    "B",
    "D",
    "N",
    "PL"
]
fixable = ["ALL"]
unfixable = []
ignore = ["PLR6301", "TRY003", "D212", "D211", "RUF002", "D203", "PLC0414"]
exclude = ['test_*']

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "rich>=14.1.0",
]

# relative_files: required by the coverage comment action, which merges .coverage files from the CI matrix
[tool.coverage.run]
relative_files = true

# Only lines that can never run by construction; real untested code must stay visible.
[tool.coverage.report]
exclude_also = [
    "@abstractmethod",
    "if TYPE_CHECKING:",
    '^\s*\.\.\.$',
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.ty.rules]
# отдельные правила: "ignore" | "warn" | "error"
possibly-unresolved-reference = "error"
# Защита от утечки Any и неполных аннотаций
unsound-assignment = "error"
unsound-return = "error"
unsound-yield = "error"
missing-type-argument = "error"
disjoint-cast = "error"

# Защита от логических ошибок и багов в рантайме
unused-awaitable = "error"
truthiness-test-of-none-union = "warn"
truthiness-test-of-callable = "error"
truthiness-test-of-iterable = "error"
possibly-missing-attribute = "error"

# Чистота кодовой базы и архитектура
missing-override-decorator = "warn"
blanket-ignore-comment = "warn"
unused-ignore-comment = "warn"
deprecated = "warn"

[tool.ty.terminal]
error-on-warning = true

# Commitizen is used only to lint commit messages (pre-commit commit-msg hook and CI).
# Versions, tags and the changelog are owned by python-semantic-release below.
[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
allow_zero_version = true
# While the version is 0.x a breaking change bumps minor (0.3.3 -> 0.4.0); 1.0.0 is released manually.
major_on_zero = false
# uv.lock stores the project version: refresh it in the release commit, otherwise `uv sync --locked` fails.
build_command = "uv lock --upgrade-package dicing && uv build"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = ["^chore", "^ci", "^docs", "^test", "^refactor", "^style", "^build"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]
