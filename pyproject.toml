[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"



[project]
name = "dicing"
version = "0.3.3"
description = "Library for TRPG's dices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.3.1",
    "typing_extensions>=4.4; python_version < '3.12'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17.0",
    "ruff>=0.12.5",
    "pytest>=7.0",
    "pre-commit>=4.3.0",
    "makefile>=1.1.0",
    "setuptools>=80.9.0",
    "uv>=0.8.14",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.100",
    # ty is pre-1.0: pin exactly, its rules change between releases
    "ty==0.0.106",
]

[project.scripts]
dicing = "dicing.cli:main"

[tool.setuptools.package-data]
dicing = ["py.typed", "utils/parser/dice_grammar.lark"]

[[tool.mypy.overrides]]
module = "dicing.*"
follow_untyped_imports = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "hello.py",
    "docs"
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
preview = true
select = [
        # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    "C90",
    "PL",
    "RUF",
    "TRY",
    "ANN",
    "S",
    "B",
    "D",
    "N",
    "PL"
]
fixable = ["ALL"]
unfixable = []
ignore = ["PLR6301", "TRY003", "D212", "D211", "RUF002", "D203", "PLC0414"]
exclude = ['test_*']

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "rich>=14.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.ty.rules]
# отдельные правила: "ignore" | "warn" | "error"
possibly-unresolved-reference = "error"
# Защита от утечки Any и неполных аннотаций
unsound-assignment = "error"
unsound-return = "error"
unsound-yield = "error"
missing-type-argument = "error"
disjoint-cast = "error"

# Защита от логических ошибок и багов в рантайме
unused-awaitable = "error"
truthiness-test-of-none-union = "warn"
truthiness-test-of-callable = "error"
truthiness-test-of-iterable = "error"
possibly-missing-attribute = "error"

# Чистота кодовой базы и архитектура
missing-override-decorator = "warn"
blanket-ignore-comment = "warn"
unused-ignore-comment = "warn"
deprecated = "warn"

[tool.ty.terminal]
error-on-warning = true
