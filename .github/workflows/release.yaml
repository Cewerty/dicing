name: Release

# A release starts only after CI succeeded for a push to main (or by hand).
# python-semantic-release decides from the commit messages whether there is anything to release:
# feat -> minor, fix/perf -> patch; docs/chore/ci/test/refactor -> no release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two releases at once and never cancel a release halfway through.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # CHANGELOG contains Russian text: make Python read/write files as UTF-8 regardless of the locale.
  PYTHONUTF8: "1"

jobs:
  release:
    name: "Версия, тег, CHANGELOG и GitHub Release"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.result.outputs.released }}
      version: ${{ steps.result.outputs.version }}
    steps:
      - name: "⏬ Забрать main со всей историей и тегами"
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: "🛡️ Релизим только проверенный CI коммит"
        id: guard
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -n "$TESTED_SHA" && "$(git rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            echo "main moved on since CI tested $TESTED_SHA; the newer commit will be released by its own run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "📦 Установить uv"
        if: steps.guard.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v7

      - name: "🐍 Установить Python"
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "🏷️ Проверить историю релизов"
        if: steps.guard.outputs.skip == 'false'
        run: python scripts/ci/validate_release_history.py

      - name: "🚀 Semantic release: версия, uv.lock, CHANGELOG, коммит, тег, сборка"
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.7.0 semantic-release -v version

      - name: "🔎 Был ли выпущен релиз"
        id: result
        if: steps.guard.outputs.skip == 'false'
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [[ -n "$tag" && -d dist ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "Released $tag"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to release: no feat/fix/perf commits since the last tag."
          fi

      - name: "💨 Smoke-тест CLI на собранном wheel"
        if: steps.result.outputs.released == 'true'
        run: bash scripts/cli_smoke_test.sh

      - name: "📤 Загрузить сборку в GitHub Release"
        if: steps.result.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==10.7.0 semantic-release -v publish

      - name: "📦 Сохранить сборку для публикации"
        if: steps.result.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: "Публикация на TestPyPI"
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dicing/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: "📤 Опубликовать на TestPyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: "Проверка пакета с TestPyPI"
    needs: [release, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "📦 Установить uv"
        uses: astral-sh/setup-uv@v7

      - name: "🐍 Установить Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "💨 Установить с TestPyPI и прогнать smoke-тест CLI"
        run: bash scripts/cli_smoke_test.sh --testpypi "${{ needs.release.outputs.version }}"

  publish-pypi:
    name: "Публикация на PyPI (после ручного подтверждения)"
    needs: [release, verify-testpypi]
    runs-on: ubuntu-latest
    # The `pypi` environment has a required reviewer: the job waits for a manual Approve.
    environment:
      name: pypi
      url: https://pypi.org/project/dicing/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: "📤 Опубликовать на PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
