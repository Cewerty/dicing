repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-json
      - id: check-docstring-first
      - id: debug-statements

  # Keep in sync with the ruff version in uv.lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Fast type check on every commit; the strict mypy gate runs in CI (`make typecheck`).
  # Runs in the project environment, so it sees the real dependencies (lark, hypothesis, ...).
  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run --extra dev ty check
        language: system
        types: [python]
        pass_filenames: false
